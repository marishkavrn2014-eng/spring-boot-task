spring.application.name=spring-boot-task

# H2 Database
spring.datasource.url=jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=my-very-secret-key-for-demo-project-1234567890
jwt.expiration=3600000

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

management.metrics.tags.application=${spring.application.name}

info.app.name=Demo Spring Boot App
info.app.description=CRUD + Security + Actuator
info.app.version=1.0.0